[tool.poetry]
name = "hass-mcp-server"
version = "0.1.0"
description = "MCP Server for Home Assistant"
authors = ["ganhammar"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14.2"
python-dateutil = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
black = "^26.10.1"
ruff = "^0.17.4"
pre-commit = "^4.7.0"
pytest-homeassistant-custom-component = "^0.13.375"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "TID251",  # banned APIs, see below
]
ignore = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"json.dumps".msg = "Serialize output with json_utils.dumps; it is compact, which saves the model a third of the tokens."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
